name: IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: YouTube IPA URL (iOS 16 base, 21.33.6)
        required: true
        default: "https://www.dropbox.com/scl/fi/1m7rq3lpkg3mfsone2299/com.google.ios.youtube-21.33.6-eeveedecrypter.ipa?rlkey=b2nsvre89881puprynwkfau8q&st=4fkh7ry8&dl=1"
        type: string
      ipa_url_ios17:
        description: Second YouTube IPA URL (iOS 17+ base, 21.36.6). Leave empty to build one IPA.
        required: false
        default: "https://www.dropbox.com/scl/fi/75n15cu8nck7c3acb8rdw/com.google.ios.youtube-21.36.6-eeveedecrypter.ipa?rlkey=kwp74418r008zept45xx6dgyx&st=6uloj87w&dl=1"
        type: string

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-deb.yml

  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Collect IPA bases
        id: targets
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          IPA_URL_IOS17: ${{ inputs.ipa_url_ios17 }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          targets = [{"label": "ios16", "url": os.environ["IPA_URL"]}]
          second = os.environ.get("IPA_URL_IOS17", "").strip()
          if second:
              targets.append({"label": "ios17", "url": second})
          print("targets=" + json.dumps(targets))
          PY

  package:
    needs: [build, plan]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: YTKACE-deb-rootless
          path: packages

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - name: Setup
        run: brew install ldid dpkg

      - name: YouTube
        env:
          IPA_URL: ${{ matrix.target.url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$IPA_URL" == "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/"* ]]; then
            curl --fail --location \
              --header "Accept: application/octet-stream" \
              --header "Authorization: Bearer $GH_TOKEN" \
              "$IPA_URL" --output YouTube.ipa
          else
            curl --fail --location "$IPA_URL" --output YouTube.ipa
          fi
          file_type=$(file --mime-type -b YouTube.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            exit 1
          fi

      - name: Inject
        id: inject
        run: |
          mkdir deb-root
          dpkg-deb -x packages/*.deb deb-root
          export LDID="$(brew --prefix)/bin/ldid"
          tweak_version="$(awk '/^Version:/ {print $2}' control)"
          youtube_version="$(python3 - <<'PY'
          import plistlib
          import zipfile

          with zipfile.ZipFile('YouTube.ipa') as archive:
              info = next(name for name in archive.namelist()
                          if name.startswith('Payload/') and name.endswith('.app/Info.plist'))
              print(plistlib.loads(archive.read(info))['CFBundleShortVersionString'])
          PY
          )"
          bundle_build_version="$(python3 Tools/altstore.py bundle-build-version \
            --youtube-version "$youtube_version" \
            --ytkace-version "$tweak_version")"
          if [ "${{ matrix.target.label }}" = "ios16" ]; then
            output="YTKACE_${tweak_version}_YouTube_iOS16_${youtube_version}.ipa"
          else
            output="YTKACE_${tweak_version}_YouTube_${youtube_version}.ipa"
          fi
          YTKACE_BUNDLE_BUILD_VERSION="$bundle_build_version" \
            bash Scripts/sideload-repack.sh YouTube.ipa deb-root/var/jb/Library/MobileSubstrate/DynamicLibraries/YTKACE.dylib "$output"
          bash Tools/verify-artifacts.sh deb-root/var/jb/Library/MobileSubstrate/DynamicLibraries/YTKACE.dylib "$output"
          echo "ipa=$output" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: YTKACE-IPA-${{ matrix.target.label }}
          path: ${{ steps.inject.outputs.ipa }}
          if-no-files-found: error

  publish:
    needs: package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: YTKACE-IPA-*
          merge-multiple: true
          path: dist

      - name: Setup
        run: brew install ldid

      - name: Release metadata
        id: metadata
        run: |
          version="$(awk '/^Version:/ {print $2}' control)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          notes="Automated IPA builds for YTKACE v$VERSION. AltStore source: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/altstore-source.json"
          git tag --force "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "YTKACE v$VERSION" --notes "$notes" --latest
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "YTKACE v$VERSION" \
              --notes "$notes" \
              --latest
          fi
          gh release upload "$TAG" dist/*.ipa --clobber

      - name: Generate AltStore source
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          args=()
          for ipa in dist/*.ipa; do
            args+=(--ipa "$ipa")
          done
          python3 Tools/altstore.py source \
            "${args[@]}" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --ytkace-version "$VERSION" \
            --output dist/altstore-source.json
          python3 -m json.tool dist/altstore-source.json >/dev/null

      - name: Publish AltStore source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: gh release upload "$TAG" dist/altstore-source.json --clobber
